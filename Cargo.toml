[package]
name = "flex_fvm"
version = "0.1.0"
edition = "2021"

[profile.profiling]
inherits = "release"
debug = 2
split-debuginfo = "packed"

[profile.release]
debug = true

[lib]
name = "flex_fvm"
path = "src/lib/lib.rs"

[[bin]]
name = "copper_example"
path = "src/bin/copper_example.rs"

[[bin]]
name = "multi_block_test"
path = "src/bin/multi_block_test.rs"

[[bin]]
name = "channel_example"
path = "src/bin/channel_example.rs"

[[bin]]
name = "burgers_equation"
path = "src/bin/burgers_equation.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = "0.32.1"
indicatif = "0.17.8"
vtkio = "0.6.3"