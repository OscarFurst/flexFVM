[package]
name = "flex_fvm"
version = "0.1.0"
edition = "2021"

[lib]
name = "flex_fvm"
path = "src/lib/lib.rs"

[[bin]]
name = "copper_example"
path = "src/bin/copper_example.rs"

[[bin]]
name = "channel_example"
path = "src/bin/channel_example.rs"

[profile.profiling]
inherits = "release"
debug = 2
split-debuginfo = "packed"
incremental = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = { version = "0.32.1", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17.8"
itertools = "0.12.1"
vtkio = "0.6.3"